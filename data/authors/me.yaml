experience:
  - role: Industrial PhD Researcher
    org: Inria and Qatent (A Questel Company)
    start: 2023-03-01
    summary: |
      Researching patent representation learning and patent-focused NLP methods.

      Current topics include:
      - self-supervised patent embeddings
      - patent text generation evaluation
      - retrieval and trend analysis over patent corpora
      - multilingual and domain-specific language modeling
  - role: R and D Engineer - NLP for Patent Analysis
    org: Qatent
    start: 2022-12-01
    summary: |
      Trained and implemented language models to enhance patent generation and retrieval-augmented generation systems for patent prior-art search.

      Conducted Open Information Extraction on patent texts and contributed to internal knowledge graph construction.

      Designed and developed domain-specific multilingual taxonomies to optimize information organization and retrieval.
  - role: Research Engineer - Large-Scale Multi-Label Patent Classification
    org: Inria Paris - ALMAnaCH
    start: 2021-10-01
    end: 2022-11-30
    summary: |
      Collaborated with the National Institute of Industrial Property (INPI) of France to build an automated patent classification system with a label space of more than 6k IPC categories.

      Conducted comparative analysis and classification experiments on both English and French corpora, including one-vs-all classifiers, transformer models, and extreme multi-label learning methods.
  - role: Research Intern - Text Mining and Ontology Construction on Patent Data
    org: CNRS - LISN
    start: 2021-03-01
    end: 2021-09-30
    summary: |
      Developed a technological terminology recognition system with high accuracy and generality for multiple CPC domains, including classes from H to I.

      Extracted and managed term definitions from patents and Wikipedia using an SQLite database.

      Implemented state-of-the-art models including TransE, M3GM, and T5 to predict direct hypernym and hyponym relations.
  - role: Data Analyst Intern
    org: JD.com
    start: 2020-06-01
    end: 2020-08-31
    summary: |
      Extracted and computed indicators from Hadoop, developed ETL tables, and transferred results to BI platforms.

      Collaborated with product managers and other departments to implement AB tests and communicate results to non-technical stakeholders.
